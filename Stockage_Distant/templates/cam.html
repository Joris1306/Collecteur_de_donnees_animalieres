<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Camera List</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Navbar with Logout -->
<nav style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); backdrop-filter:blur(6px);">
  <h2 style="margin:0; color:var(--text); font-size:20px; font-weight:600;">Data Monitoring System</h2>
  <div style="display:flex; align-items:center; gap:20px;">
    <span style="color:var(--muted); font-size:14px;">Logged in as: <strong style="color:var(--text);">{{ session.get('user', 'Unknown') }}</strong></span>
    <a href="{{ url_for('logout') }}" style="padding:10px 16px; background:linear-gradient(180deg, var(--panel2), var(--panel)); color:var(--text); text-decoration:none; border:1px solid var(--border); border-radius:12px; cursor:pointer; font-size:14px; font-weight:500; transition:all 0.2s ease;">Logout</a>
  </div>
</nav>

<div class="container">
  <div class="topbar">
    <div class="title">
      <h1>Registered Cameras</h1>
      <div class="subtitle">
        Wildlife Monitoring System — Active camera overview
      </div>
    </div>

    <div class="actions">
      <button onclick="history.back()" class="btn">Back to Images</button>
      <button class="btn" id="btnToggle">Toggle Layout</button>
    </div>
  </div>

  <div class="grid" id="grid">
    {% for cam in cam_list %}
      <article onclick="window.location.href='/battery/{{ cam.id }}/graph'" class="card">
        <div class="content">
          <div class="row">
            <div class="badge">ID {{ cam.id }}</div>
            <div class="pill">{{ cam.battery }}</div>
          </div>

          <div class="meta">
            <div class="kv">
              <div class="k">Name</div>
              <div class="v">{{ cam.name }}</div>
            </div>

            <div class="kv">
              <div class="k">Location</div>
              <div class="v">{{ cam.location }}</div>
            </div>
          </div>
        </div>
      </article>
    {% endfor %}
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
