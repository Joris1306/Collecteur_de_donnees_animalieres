<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Map</title>

    <!-- Link external stylesheet -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Navbar with Logout -->
<nav style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); backdrop-filter:blur(6px);">
  <h2 style="margin:0; color:var(--text); font-size:20px; font-weight:600;">Data Monitoring System</h2>
  <div style="display:flex; align-items:center; gap:20px;">
    <span style="color:var(--muted); font-size:14px;">Logged in as: <strong style="color:var(--text);">{{ session.get('user', 'Unknown') }}</strong></span>
    <a href="{{ url_for('logout') }}" style="padding:10px 16px; background:linear-gradient(180deg, var(--panel2), var(--panel)); color:var(--text); text-decoration:none; border:1px solid var(--border); border-radius:12px; cursor:pointer; font-size:14px; font-weight:500; transition:all 0.2s ease;">Logout</a>
  </div>
</nav>

<div class="container">
    <div class="topbar">
        <div class="title">
            <h2>Camera Map</h2>
            <div class="subtitle">Live camera locations</div>
        </div>
        <div class="actions">
            <button class="btn" onclick="history.back()">Back</button>
        </div>

    </div>
    
    <div class="card">
        <iframe
            src="/map/submap"
            style="width:100%; height:90vh; border:none;"
            loading="lazy"
            target="_top">
        </iframe>
    </div>
</div>

</body>
</html>
