<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Map</title>

    <!-- Link external stylesheet -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <div class="topbar">
        <div class="title">
            <h2>Camera Map</h2>
            <div class="subtitle">Live camera locations</div>
        </div>
        <div class="actions">
            <button class="btn" onclick="history.back()">Back</button>
        </div>

    </div>
    
    <div class="card">
        <iframe
            src="/map/submap"
            style="width:100%; height:90vh; border:none;"
            loading="lazy"
            target="_top">
        </iframe>
    </div>
</div>

</body>
</html>
