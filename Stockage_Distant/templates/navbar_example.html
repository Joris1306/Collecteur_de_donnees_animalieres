<!-- 
  Add this navbar/header to all your HTML templates to show user info and logout button
  Make sure your template includes: <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
-->

<nav style="
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  backdrop-filter: blur(6px);
">
    <div>
        <h2 style="margin: 0; color: var(--text); font-size: 20px; font-weight: 600;">Data Monitoring System</h2>
    </div>
    <div style="display: flex; align-items: center; gap: 20px;">
        <span style="color: var(--muted); font-size: 14px;">
            Logged in as: <strong style="color: var(--text);">{{ session.get('user', 'Unknown') }}</strong>
        </span>
        <a href="{{ url_for('logout') }}" style="
            padding: 10px 16px;
            background: linear-gradient(180deg, var(--panel2), var(--panel));
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        " onmouseover="this.style.background='linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.08))'; this.style.transform='translateY(-2px)';" onmouseout="this.style.background='linear-gradient(180deg, var(--panel2), var(--panel))'; this.style.transform='translateY(0)';">
            Logout
        </a>
    </div>
</nav>

<!-- 
  USAGE:
  1. Add this to the top of each HTML template body
  2. Or create a base template and extend from it
  
  Example with Jinja2 template inheritance:
  
  base.html:
  -----------
  <!DOCTYPE html>
  <html>
  <head>
      <meta charset="UTF-8">
      <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
      <title>{% block title %}Data System{% endblock %}</title>
  </head>
  <body>
      {% include 'navbar_example.html' %}
      
      {% block content %}{% endblock %}
  </body>
  </html>
  
  page.html:
  -----------
  {% extends "base.html" %}
  {% block title %}My Page{% endblock %}
  {% block content %}
      <h1>Welcome!</h1>
  {% endblock %}
-->
