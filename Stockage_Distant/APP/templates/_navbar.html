<nav style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); backdrop-filter:blur(6px);">
  <div style="display:flex; align-items:center; gap:20px;">
    <h2 style="margin:0; color:var(--text); font-size:20px; font-weight:600;">{{ t("app.title") }}</h2>

    {% if not hide_nav_links %}
      <!-- Navigation links -->
      <a href="{{ url_for('home') }}" title="{{ t('nav.home') }}" aria-label="{{ t('nav.home') }}" class="btn" style="padding:8px 10px; min-width:38px; text-align:center; border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; background:linear-gradient(180deg, var(--panel2), var(--panel));">
        🏠
      </a>

      <a href="{{ url_for('index') }}" title="{{ t('nav.images') }}" aria-label="{{ t('nav.images') }}" class="btn" style="padding:8px 10px; min-width:38px; text-align:center; border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; background:linear-gradient(180deg, var(--panel2), var(--panel));">
        🖼️
      </a>

      <a href="{{ url_for('map') }}" title="{{ t('nav.map') }}" aria-label="{{ t('nav.map') }}" class="btn" style="padding:8px 10px; min-width:38px; text-align:center; border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; background:linear-gradient(180deg, var(--panel2), var(--panel));">
        🗺️
      </a>

      <a href="{{ url_for('cam') }}" title="{{ t('nav.cam') }}" aria-label="{{ t('nav.cam') }}" class="btn" style="padding:8px 10px; min-width:38px; text-align:center; border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; background:linear-gradient(180deg, var(--panel2), var(--panel));">
        📷
      </a>

      <a href="{{ url_for('battery') }}" title="{{ t('nav.battery') }}" aria-label="{{ t('nav.battery') }}" class="btn" style="padding:8px 10px; min-width:38px; text-align:center; border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; background:linear-gradient(180deg, var(--panel2), var(--panel));">
        🔋
      </a>

      <a href="{{ url_for('journal') }}" title="{{ t('nav.journal') }}" aria-label="{{ t('nav.journal') }}" class="btn" style="padding:8px 10px; min-width:38px; text-align:center; border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; background:linear-gradient(180deg, var(--panel2), var(--panel));">
        📔
      </a>

      {% if current_role in ['dev','admin'] %}
        <a href="{{ url_for('index_hidden') }}" title="{{ t('nav.hidden') }}" aria-label="{{ t('nav.hidden') }}" class="btn" style="padding:8px 10px; min-width:38px; text-align:center; border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; background:linear-gradient(180deg, var(--panel2), var(--panel));">
          🗄️
        </a>

        <a href="{{ url_for('config_ai') }}" title="{{ t('nav.config') }}" aria-label="{{ t('nav.config') }}" rel="noopener" class="btn" style="padding:8px 10px; min-width:38px; text-align:center; border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; background:linear-gradient(180deg, var(--panel2), var(--panel));">
          ⚙️
        </a>
      {% endif %}
    {% endif %}
  </div>

  <div style="display:flex; align-items:center; gap:12px;">
    <!-- Language switch -->
    <div style="display:flex; gap:6px; align-items:center;">
      <a href="{{ url_for('set_lang', lang='en') }}"
         class="btn"
         style="padding:6px 10px; font-size:12px; border-radius:10px; border:1px solid var(--border); text-decoration:none;
                {% if lang == 'en' %}background:rgba(100,200,255,.18); border-color:rgba(100,200,255,.45);{% else %}background:linear-gradient(180deg, var(--panel2), var(--panel));{% endif %}">
        EN
      </a>

      <a href="{{ url_for('set_lang', lang='fr') }}"
         class="btn"
         style="padding:6px 10px; font-size:12px; border-radius:10px; border:1px solid var(--border); text-decoration:none;
                {% if lang == 'fr' %}background:rgba(100,200,255,.18); border-color:rgba(100,200,255,.45);{% else %}background:linear-gradient(180deg, var(--panel2), var(--panel));{% endif %}">
        FR
      </a>

      <a href="{{ url_for('set_lang', lang='cn') }}"
         class="btn"
         style="padding:6px 10px; font-size:12px; border-radius:10px; border:1px solid var(--border); text-decoration:none;
                {% if lang == 'cn' %}background:rgba(100,200,255,.18); border-color:rgba(100,200,255,.45);{% else %}background:linear-gradient(180deg, var(--panel2), var(--panel));{% endif %}">
        中文
      </a>
    </div>

    <span style="color:var(--muted); font-size:14px;">
      {{ t("nav.logged_in_as") }}:
      <strong style="color:var(--text);">{{ current_user or session.get('user', 'Unknown') }}</strong>
    </span>

    <a href="{{ url_for('logout') }}"
       title="{{ t('nav.logout') }}"
       aria-label="{{ t('nav.logout') }}"
       style="padding:10px 12px; min-width:40px; text-align:center; background:linear-gradient(180deg, var(--panel2), var(--panel)); color:var(--text); text-decoration:none; border:1px solid var(--border); border-radius:12px; cursor:pointer; font-size:14px; font-weight:500; transition:all 0.2s ease;">
      ↩️
    </a>
  </div>
</nav>
