<!DOCTYPE html>
<html>
<head>
    <title>Battery Monitoring</title>
    {% include '_favicon.html' %}
    {% include '_styles.html' %}
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
    
    <style>
        .battery-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .camera-list {
            flex: 0 0 200px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
            border-radius: 14px;
            overflow-y: auto;
            max-height: 600px;
        }
        
        .camera-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .camera-item:hover {
            background: rgba(255,255,255,.08);
        }
        
        .camera-item.active {
            background: linear-gradient(180deg, var(--panel2), var(--panel));
            font-weight: 600;
            border-left: 3px solid rgba(100, 200, 255, 0.8);
            padding-left: 13px;
        }
        
        .camera-id {
            font-weight: 600;
            color: var(--text);
        }
        
        .camera-battery {
            font-size: 12px;
            color: var(--muted);
        }
        
        .graph-container {
            flex: 1;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
            border-radius: 14px;
            padding: 16px;
        }
        
        .graph-title {
            color: var(--text);
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        @media (max-width: 820px) {
            .battery-container {
                flex-direction: column;
            }
            
            .camera-list {
                max-height: 200px;
                flex: 0 0 auto;
            }
        }
    </style>
</head>
<body>

{% include '_navbar.html' %}

<div class="container">
    <div class="topbar">
        <div class="title">
            <h1>🔋 Battery Monitoring</h1>
            <div class="subtitle">
                Real-time battery level tracking for all cameras
            </div>
        </div>
        <div class="actions">
            <button class="btn" onclick="window.history.back()">⬅ Back</button>
            <button class="btn" onclick="window.location.reload()">Refresh</button>
        </div>
    </div>

    <div class="battery-container">
        <!-- Camera List -->
        <div class="camera-list" id="cameraList">
            {% for cam in cameras %}
                <div class="camera-item {% if cam.CAM_ID == default_cam_id %}active{% endif %}" 
                     onclick="selectCamera({{ cam.CAM_ID }})">
                    <div class="camera-id">📷 Camera {{ cam.CAM_ID }}</div>
                    <!-- <div class="camera-battery">🔋 {{ cam.BATTERY or 'N/A' }}%</div> -->
                </div>
            {% endfor %}
        </div>

        <!-- Graph Container -->
        <div class="graph-container">
            <div class="graph-title" id="graphTitle">Battery — Camera {{ default_cam_id }}</div>
            <article class="card" style="border: none; background: transparent; box-shadow: none;">
                <div class="content" style="padding: 0;">
                    <canvas id="batteryGraph" height="120"></canvas>
                </div>
            </article>
        </div>
    </div>
</div>

<script>
    let currentCamId = {{ default_cam_id }};
    let chartInstance = null;

    async function selectCamera(camId) {
        currentCamId = camId;
        
        // Update active state
        document.querySelectorAll('.camera-item').forEach(item => {
            item.classList.remove('active');
        });
        event.currentTarget.classList.add('active');
        
        // Update title
        document.getElementById('graphTitle').textContent = `Battery — Camera ${camId}`;
        
        // Fetch and update graph
        await updateGraph(camId);
    }

    async function updateGraph(camId) {
        try {
            const response = await fetch(`/battery/${camId}/data`);
            const data = await response.json();

            if (!data || data.length === 0) {
                console.log('No data available for camera', camId);
                return;
            }

            const labels = data.map(d => new Date(d.UPDATE_DATE));
            const values = data.map(d => parseFloat(d.BATTERY) || 0);

            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = values;
                chartInstance.update();
            } else {
                const ctx = document.getElementById('batteryGraph').getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: `Battery Level (%)`,
                            data: values,
                            borderColor: 'rgba(100, 200, 255, 0.8)',
                            backgroundColor: 'rgba(100, 200, 255, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: 'rgba(100, 200, 255, 0.8)',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointHoverRadius: 6,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                labels: {
                                    color: 'rgba(255,255,255,.92)',
                                    font: { size: 12, weight: 'bold' }
                                }
                            }
                        },
                        scales: {
                            y: {
                                min: 0,
                                max: 100,
                                ticks: { color: 'rgba(255,255,255,.62)' },
                                grid: { color: 'rgba(255,255,255,.05)' }
                            },
                            x: {
                                type: 'time',
                                time: {
                                    unit: 'minute',
                                    displayFormats: {
                                        second: 'HH:mm:ss',
                                        minute: 'HH:mm:ss',
                                        hour: 'HH:mm:ss-dd/MM/yyyy',
                                        day: 'HH:mm:ss-dd/MM/yyyy',
                                        week: 'HH:mm:ss-dd/MM/yyyy',
                                        month: 'HH:mm:ss-dd/MM/yyyy',
                                        quarter: 'HH:mm:ss-dd/MM/yyyy',
                                        year: 'HH:mm:ss-dd/MM/yyyy'
                                    }
                                },
                                ticks: { 
                                    color: 'rgba(255,255,255,.62)',
                                    callback: function(value) {
                                        const date = new Date(value);
                                        const hours = String(date.getHours()).padStart(2, '0');
                                        const minutes = String(date.getMinutes()).padStart(2, '0');
                                        const seconds = String(date.getSeconds()).padStart(2, '0');
                                        const day = String(date.getDate()).padStart(2, '0');
                                        const month = String(date.getMonth() + 1).padStart(2, '0');
                                        const year = date.getFullYear();
                                        return `${hours}:${minutes}:${seconds}-${day}/${month}/${year}`;
                                    }
                                },
                                grid: { color: 'rgba(255,255,255,.05)' }
                            }
                        }
                    }
                });
            }
        } catch (error) {
            console.error('Error loading battery data:', error);
        }
    }

    // Load initial graph
    window.addEventListener('DOMContentLoaded', () => {
        updateGraph(currentCamId);
    });
</script>

</body>
</html>
