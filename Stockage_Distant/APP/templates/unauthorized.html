<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unauthorized</title>
    {% include '_favicon.html' %}
    {% include '_styles.html' %}

    <style>
        .wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { max-width: 520px; width: 100%; padding: 28px; border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.05)); box-shadow: var(--shadow); }
        h1 { margin: 0 0 12px; }
        p { color: var(--muted); margin: 0 0 20px; }
        a.btn { display: inline-block; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-decoration: none; background: linear-gradient(180deg, var(--panel2), var(--panel)); }
        a.btn:hover { transform: translateY(-1px); }
    </style>
</head>
<body>
    {% include '_navbar.html' %}
    <div class="wrapper">
        <div class="card">
            <h1>Access denied</h1>
            <p>You don’t have permission to view this page.</p>
            {% if session.get('user') %}
                <a class="btn" href="{{ url_for('home') }}">Go to Home</a>
            {% else %}
                <a class="btn" href="{{ url_for('login_page') }}">Go to Login</a>
            {% endif %}
        </div>
    </div>
    {% include '_footer.html' %}
</body>
</html>
